[project]
name = "deepseek-ocr"
version = "0.2.0"
description = "DeepSeek-OCR: Convert documents (PDF/PNG/JPG) to Markdown (GPU/CPU support)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.46.0,<4.50.0",
    "tokenizers>=0.20.0,<0.21.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "accelerate>=0.25.0",
    "matplotlib>=3.8.0",
    "addict>=2.4.0",
    "timm>=0.9.0",
    "easydict>=1.10",
]

[project.scripts]
deepseek_ocr = "deepseek_ocr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["deepseek_ocr"]
